---
- name: Emit deprecation warnings for dashboard testing
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Bool-filter style message
      emit_deprecation:
        message: "The `bool` filter coerced invalid value 'maybe' (str) to False"
    - name: Empty conditional style message
      emit_deprecation:
        message: 'Empty conditional expression was evaluated as True'
    - name: Unique free-text warning
      emit_deprecation:
        message: 'Example custom deprecation used only for dashboard verification'
    - name: Another distinct warning
      emit_deprecation:
        message: 'Using a mapping for `action` is deprecated. Use a string value for `action`'
